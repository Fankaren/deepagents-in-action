<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="他律笔记 头像 · 深墨圆相（飞白墨韵）">
  <defs>
    <radialGradient id="inkbg" cx="0.5" cy="0.44" r="0.84">
      <stop offset="0" stop-color="#1A1E26"/>
      <stop offset="1" stop-color="#0D1015"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8B672"/>
      <stop offset="1" stop-color="#B98F45"/>
    </linearGradient>
    <filter id="grain3" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="brush3" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="aged3" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="streaks3" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#0D1015" stroke-width="3.2" opacity="0.55"/>
    </pattern>
    <mask id="charMask3">
      <text x="256" y="248" text-anchor="middle" dominant-baseline="central"
            font-family="'STKaiti','KaiTi','Kaiti SC','STXingkai','LiSu','Noto Serif SC','Source Han Serif SC','Songti SC',serif"
            font-size="246" font-weight="800" fill="#ffffff">律</text>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#inkbg)"/>
  <rect width="512" height="512" filter="url(#grain3)" opacity="0.5"/>

  <circle cx="256" cy="248" r="176" fill="none" stroke="url(#gold)" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="1006 84"
          transform="rotate(116 256 248)" opacity="0.92" filter="url(#brush3)"/>

  <!-- 律：暖白飞白 -->
  <text x="256" y="248" text-anchor="middle" dominant-baseline="central"
        font-family="'STKaiti','KaiTi','Kaiti SC','STXingkai','LiSu','Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="246" font-weight="800" fill="#ECE4D3" filter="url(#brush3)">律</text>
  <g mask="url(#charMask3)"><rect width="512" height="512" fill="url(#streaks3)" opacity="0.35"/></g>

  <g filter="url(#aged3)">
    <rect x="324" y="326" width="86" height="86" rx="8" fill="#8E3A2A"/>
    <rect x="331" y="333" width="72" height="72" rx="5" fill="none" stroke="#F2E9D8" stroke-width="3" opacity="0.88"/>
    <text x="367" y="354" text-anchor="middle" dominant-baseline="central"
          font-family="'STKaiti','KaiTi','STZhongsong','Noto Serif SC','Source Han Serif SC',serif"
          font-size="31" font-weight="700" fill="#F2E9D8">他</text>
    <text x="367" y="388" text-anchor="middle" dominant-baseline="central"
          font-family="'STKaiti','KaiTi','STZhongsong','Noto Serif SC','Source Han Serif SC',serif"
          font-size="31" font-weight="700" fill="#F2E9D8">律</text>
  </g>
</svg>
