<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="他律手记 头像（笔记符号版）">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="0.55" stop-color="#FFB13B"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <radialGradient id="bg2" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#1C2A44"/>
      <stop offset="1" stop-color="#0C1220"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg2)"/>

  <!-- 笔记卡 -->
  <rect x="104" y="86" width="304" height="340" rx="42" fill="none" stroke="url(#g2)" stroke-width="16"/>

  <!-- 记录横线 -->
  <line x1="164" y1="182" x2="348" y2="182" stroke="#EEF2F8" stroke-width="18" stroke-linecap="round"/>
  <line x1="164" y1="252" x2="348" y2="252" stroke="#EEF2F8" stroke-width="18" stroke-linecap="round" opacity="0.85"/>

  <!-- 对勾：律（规则 / 达成） -->
  <path d="M172 334 l34 34 l74 -96" fill="none" stroke="url(#g2)"
        stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
