<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="他律手记 公众号次图模板">
  <defs>
    <radialGradient id="paper" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0" stop-color="#F8F3E8"/>
      <stop offset="1" stop-color="#E6DCC6"/>
    </radialGradient>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#26221B"/>
      <stop offset="1" stop-color="#0C0A07"/>
    </linearGradient>
    <filter id="brush" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#paper)"/>
  <circle cx="100" cy="96" r="66" fill="none" stroke="#26231E" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="382 34" transform="rotate(120 100 96)"
          opacity="0.85" filter="url(#brush)"/>
  <text x="100" y="96" text-anchor="middle" dominant-baseline="central"
        font-family="'STKaiti','KaiTi','Noto Serif SC','Songti SC',serif"
        font-size="76" font-weight="800" fill="url(#ink)" filter="url(#brush)">律</text>
  <text x="100" y="184" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC',serif"
        font-size="15" fill="#8A7B5E" letter-spacing="1">他律手记</text>
</svg>
