<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="他律手记 头像 · 榜书大字（飞白墨韵）">
  <defs>
    <radialGradient id="paper" cx="0.5" cy="0.46" r="0.8">
      <stop offset="0" stop-color="#F8F3E8"/>
      <stop offset="1" stop-color="#E7DEC9"/>
    </radialGradient>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#26221B"/>
      <stop offset="1" stop-color="#0C0A07"/>
    </linearGradient>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <!-- 毛笔飞白：湍流位移让笔画边缘带墨韵 -->
    <filter id="brush" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 不规则飞白纹理（湍流生成，替代机械斜线） -->
    <filter id="feibai" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.45" numOctaves="2" seed="12" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.972
                0 0 0 0 0.951
                0 0 0 0 0.909
                0 0 0 -16 2.7"/>
    </filter>
    <!-- 做旧（仅用于印章边框） -->
    <filter id="aged" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="charMask">
      <text x="256" y="252" text-anchor="middle" dominant-baseline="central"
            font-family="'STKaiti','KaiTi','Kaiti SC','STXingkai','LiSu','Noto Serif SC','Source Han Serif SC','Songti SC',serif"
            font-size="376" font-weight="800" fill="#ffffff">律</text>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#paper)"/>
  <rect width="512" height="512" filter="url(#paperGrain)" opacity="0.6"/>

  <!-- 淡墨晕染 -->
  <text x="256" y="252" text-anchor="middle" dominant-baseline="central"
        font-family="'STKaiti','KaiTi','Kaiti SC','STXingkai','LiSu','Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="392" font-weight="800" fill="#141210" opacity="0.1" filter="url(#blur)">律</text>

  <!-- 主字：墨色渐变 + 笔意 -->
  <text x="256" y="252" text-anchor="middle" dominant-baseline="central"
        font-family="'STKaiti','KaiTi','Kaiti SC','STXingkai','LiSu','Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="376" font-weight="800" fill="url(#ink)" filter="url(#brush)">律</text>

  <!-- 飞白：不规则纹理叠进笔画内 -->
  <g mask="url(#charMask)"><rect width="512" height="512" filter="url(#feibai)" opacity="0.32"/></g>

  <!-- 做旧朱文小印：边框做旧、字保持清晰、字不出框 -->
  <rect x="322" y="326" width="92" height="92" rx="9" fill="#8E3A2A" filter="url(#aged)"/>
  <rect x="330" y="334" width="76" height="76" rx="5" fill="none" stroke="#F2E9D8" stroke-width="3" opacity="0.92"/>
  <text x="368" y="357" text-anchor="middle" dominant-baseline="central"
        font-family="'STKaiti','KaiTi','STZhongsong','Noto Serif SC','Source Han Serif SC',serif"
        font-size="33" font-weight="700" fill="#F2E9D8">他</text>
  <text x="368" y="392" text-anchor="middle" dominant-baseline="central"
        font-family="'STKaiti','KaiTi','STZhongsong','Noto Serif SC','Source Han Serif SC',serif"
        font-size="33" font-weight="700" fill="#F2E9D8">律</text>
</svg>
