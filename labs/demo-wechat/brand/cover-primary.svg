<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383" role="img" aria-label="他律手记 公众号首图模板">
  <defs>
    <radialGradient id="paper" cx="0.3" cy="0.4" r="0.95">
      <stop offset="0" stop-color="#F8F3E8"/>
      <stop offset="1" stop-color="#E6DCC6"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#26221B"/>
      <stop offset="1" stop-color="#0C0A07"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="brush" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="6" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="aged" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="900" height="383" fill="url(#paper)"/>
  <rect width="900" height="383" filter="url(#grain)" opacity="0.6"/>

  <!-- 右侧：禅意圆相 + 律（缩小右移，给标题留出宽度） -->
  <circle cx="778" cy="196" r="104" fill="none" stroke="#26231E" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="604 52" transform="rotate(120 778 196)"
          opacity="0.8" filter="url(#brush)"/>
  <text x="778" y="196" text-anchor="middle" dominant-baseline="central"
        font-family="'STKaiti','KaiTi','Kaiti SC','Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="122" font-weight="800" fill="url(#ink)" filter="url(#brush)">律</text>

  <!-- 左侧文字区（宽度到 x≈640） -->
  <text x="64" y="108" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="27" fill="#8A7B5E" letter-spacing="2">他律手记 · {{SERIES}}</text>

  <text x="64" y="196" font-family="'STKaiti','KaiTi','Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="50" font-weight="800" fill="url(#ink)">{{TITLE1}}</text>
  <text x="64" y="262" font-family="'STKaiti','KaiTi','Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="50" font-weight="800" fill="url(#ink)">{{TITLE2}}</text>

  <text x="64" y="316" font-family="'Noto Serif SC','Source Han Serif SC',serif"
        font-size="25" fill="#5A5245">{{SUBTITLE}}</text>
  <text x="64" y="356" font-family="'Noto Serif SC','Source Han Serif SC',serif"
        font-size="22" fill="#8A7B5E">不靠意志力，靠系统</text>

  <!-- 做旧朱印 -->
  <rect x="824" y="304" width="58" height="58" rx="7" fill="#8E3A2A" filter="url(#aged)"/>
  <rect x="829" y="309" width="48" height="48" rx="4" fill="none" stroke="#F2E9D8" stroke-width="2.4" opacity="0.9"/>
  <text x="853" y="333" text-anchor="middle" dominant-baseline="central"
        font-family="'STKaiti','KaiTi','STZhongsong',serif" font-size="20" font-weight="700" fill="#F2E9D8">手</text>
  <text x="853" y="355" text-anchor="middle" dominant-baseline="central"
        font-family="'STKaiti','KaiTi','STZhongsong',serif" font-size="20" font-weight="700" fill="#F2E9D8">记</text>
</svg>
