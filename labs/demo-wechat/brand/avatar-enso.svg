<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="他律笔记 头像 · 禅意圆相">
  <defs>
    <radialGradient id="paper2" cx="0.5" cy="0.46" r="0.8">
      <stop offset="0" stop-color="#F8F3E8"/>
      <stop offset="1" stop-color="#E8E0CF"/>
    </radialGradient>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#paper2)"/>
  <rect width="512" height="512" filter="url(#grain2)" opacity="0.6"/>

  <!-- 圆相（不闭合，笔意） -->
  <circle cx="256" cy="248" r="172" fill="none" stroke="#26231E" stroke-width="13"
          stroke-linecap="round" stroke-dasharray="1002 78"
          transform="rotate(120 256 248)" opacity="0.85"/>

  <!-- 律 -->
  <text x="256" y="246" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"
        font-size="216" font-weight="700" fill="#22201C">律</text>

  <!-- 真印章 -->
  <rect x="312" y="312" width="108" height="108" rx="10" fill="#9E3B2E" opacity="0.96"/>
  <rect x="321" y="321" width="90" height="90" rx="6" fill="none" stroke="#F6F0E4" stroke-width="3.5" opacity="0.9"/>
  <text x="366" y="352" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="42" font-weight="700" fill="#F6F0E4">他</text>
  <text x="366" y="398" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="42" font-weight="700" fill="#F6F0E4">律</text>
</svg>
