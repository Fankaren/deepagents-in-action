<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="他律笔记 头像 · 深墨圆相">
  <defs>
    <radialGradient id="inkbg" cx="0.5" cy="0.44" r="0.82">
      <stop offset="0" stop-color="#191D25"/>
      <stop offset="1" stop-color="#0E1116"/>
    </radialGradient>
    <filter id="grain3" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#inkbg)"/>
  <rect width="512" height="512" filter="url(#grain3)" opacity="0.5"/>

  <circle cx="256" cy="248" r="172" fill="none" stroke="#C6A15B" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="996 84"
          transform="rotate(116 256 248)" opacity="0.9"/>

  <text x="256" y="246" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"
        font-size="216" font-weight="700" fill="#ECE4D3">律</text>

  <!-- 印章（深墨版：暖白字/朱红底） -->
  <rect x="312" y="312" width="108" height="108" rx="10" fill="#A6402F"/>
  <rect x="321" y="321" width="90" height="90" rx="6" fill="none" stroke="#ECE4D3" stroke-width="3.5" opacity="0.9"/>
  <text x="366" y="352" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="42" font-weight="700" fill="#ECE4D3">他</text>
  <text x="366" y="398" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="42" font-weight="700" fill="#ECE4D3">律</text>
</svg>
